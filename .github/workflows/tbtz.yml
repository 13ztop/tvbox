name: Sync upstream repository

on:
  schedule:
    # 每天 UTC 时间 00:00 自动同步（北京时间 08:00）
    - cron: '0 0 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  sync-repo:
    runs-on: ubuntu-latest

    steps:
      # 步骤 1：检出目标仓库
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: 13ztop/tvbox
          token: ${{ secrets.SYNC_TOKEN }}
          path: target

      # 步骤 2：克隆源仓库
      - name: Clone source repo
        run: |
          git clone --depth 1 https://github.com/cluntop/tvbox.git source

      # 步骤 3：同步并排除文件
      - name: Sync with exclusions
        run: |
          cd source

          # 删除需要排除的文件/目录
          rm -rf README.md .github/workflows
          
          # 移动所有文件到目标仓库目录
          shopt -s dotglob
          mv -f * ../target/
          cd ../target

          # 设置 Git 身份
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 提交变更
          git add -A
          git commit -m "chore: auto-sync from upstream" || echo "没有变更需要提交"
        shell: bash

      # 步骤 4：推送更改
      - name: Push changes
        run: |
          cd target
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_TOKEN }}

      # 步骤 5：发送 Telegram 通知
      - name: Send Telegram notification
        uses: appleboy/telegram-action@master
        if: always()  # 无论成功失败都发送通知
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_TOKEN }}
          message: |
            ${{ job.status }} - 仓库同步完成
            仓库: 13ztop/tvbox
            状态: ${{ job.status }}
            触发方式: ${{ github.event_name }}
            时间: ${{ steps.get-timestamp.outputs.time }}
        env:
          TELEGRAM_FILTER: 'commit,mention'

  get-timestamp:
    runs-on: ubuntu-latest
    outputs:
      time: ${{ steps.timestamp.outputs.time }}
    steps:
      - name: Get current timestamp
        id: timestamp
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT
