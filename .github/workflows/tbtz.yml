name: Optimized TVBoxTG Sync

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_REPO_OWNER: "cluntop"
      SOURCE_REPO_NAME: "tvbox"
      TARGET_REPO_OWNER: "13ztop"
      TARGET_REPO_NAME: "tvbox"
      TARGET_FULL_REPO: "13ztop/tvbox"
      TZ: Asia/Shanghai

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_FULL_REPO }}
          token: ${{ secrets.SYNC_TOKEN }}
          path: target-repo

      - name: Setup environment
        id: setup
        run: |
          TARGET_BRANCH=$(git -C target-repo rev-parse --abbrev-ref HEAD)
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT

          SOURCE_COMMIT=$(curl -s "https://api.github.com/repos/${{ env.SOURCE_REPO_OWNER }}/${{ env.SOURCE_REPO_NAME }}/commits/main" | jq -r .sha)
          SOURCE_SHORT=${SOURCE_COMMIT:0:7}
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> $GITHUB_ENV
          echo "SOURCE_SHORT=$SOURCE_SHORT" >> $GITHUB_ENV
          echo "source_commit=$SOURCE_COMMIT" >> $GITHUB_OUTPUT
          echo "source_short=$SOURCE_SHORT" >> $GITHUB_OUTPUT

      - name: Clone source repository
        run: |
          git clone --depth 1 --filter=blob:none \
            "https://github.com/${{ env.SOURCE_REPO_OWNER }}/${{ env.SOURCE_REPO_NAME }}.git" source-repo

      - name: Smart sync with rsync
        run: |
          sudo apt-get update && sudo apt-get install -y rsync
          EXCLUDE_FILE="/tmp/exclude-list.txt"
          echo "README.md" > $EXCLUDE_FILE
          echo ".github/" >> $EXCLUDE_FILE
          rsync -av --delete --exclude-from="$EXCLUDE_FILE" source-repo/ target-repo/

      - name: Detect changes
        id: change_detection
        run: |
          cd target-repo
          git config user.name "GitHub Actions Sync Bot"
          git config user.email "github-actions-sync-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --exit-code --quiet; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            CHANGES_COUNT=$(git diff --cached --name-only | wc -l)
            echo "changes_count=$CHANGES_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.change_detection.outputs.has_changes == 'true'
        run: |
          cd target-repo
          git config user.name "GitHub Actions Sync Bot"
          git config user.email "github-actions-sync-bot@users.noreply.github.com"
          git add -A
          
          # 修正的heredoc语法部分
          COMMIT_MSG=$(cat <<EOF
Sync: ${{ env.SOURCE_REPO_OWNER }}/${{ env.SOURCE_REPO_NAME }}@${{ env.SOURCE_SHORT }}

• Updated ${{ steps.change_detection.outputs.changes_count }} files
• Excluded README.md and .github/workflows/
EOF
          )
          
          git commit -m "$COMMIT_MSG"
          git push origin "HEAD:${{ env.TARGET_BRANCH }}"

      - name: Notify Telegram - Success
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ${{ steps.change_detection.outputs.has_changes == 'true' && '✅ TVBoxTG 同步成功' || 'ℹ️ TVBoxTG 无变更' }} | ${{ env.TZ }}
            ━━━━━━━━━━━━━━━━━━━━━━━━
            🔄 *源仓库*: ${{ env.SOURCE_REPO_OWNER }}/${{ env.SOURCE_REPO_NAME }}
            📦 *目标仓库*: ${{ env.TARGET_REPO_OWNER }}/${{ env.TARGET_REPO_NAME }}
            ━━━━━━━━━━━━━━━━━━━━━━━━
            ${{ steps.change_detection.outputs.has_changes == 'true' && format('📂 *变更文件*: {0} 个', steps.change_detection.outputs.changes_count) || '🆗 *同步状态*: 内容一致，无需更新' }}
            🔒 *排除文件*: README.md, .github/workflows/
            🕒 *执行时间*: $(date +'%Y-%m-%d %H:%M:%S')
            ━━━━━━━━━━━━━━━━━━━━━━━━
            ${{ steps.change_detection.outputs.has_changes == 'true' && '🎉 仓库已更新!' || '👍 仓库已是最新状态!' }}

      - name: Notify Telegram - Failure
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: markdown
          message: |
            ‼️ *TVBoxTG 同步失败* | ${{ env.TZ }}
            ━━━━━━━━━━━━━━━━━━━━━━━━
            ⚙️ *工作流*: ${{ github.workflow }}
            🕒 *发生时间*: $(date +'%Y-%m-%d %H:%M:%S')
            ━━━━━━━━━━━━━━━━━━━━━━━━
            ❌ *错误详情*: 请检查工作流日志

      - name: Cleanup
        if: always()
        run: |
          rm -rf source-repo target-repo
          rm -f /tmp/exclude-list.txt
