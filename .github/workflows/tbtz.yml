name: Auto Sync from cluntop/tvbox

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点（北京时间 8 点）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: 设置 Git 用户
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: 克隆上游仓库
      run: |
        git clone --depth=1 https://github.com/cluntop/tvbox upstream

    - name: 克隆目标仓库
      run: |
        git clone --depth=1 https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/13ztop/tvbox target
        cp -r target/.git upstream/

    - name: 排除指定文件和目录（彻底忽略同步）
      run: |
        cd upstream

        # 要排除的文件或目录（支持嵌套）
        EXCLUDE_LIST="
        README.md
        .github/workflows/
        .github/.github/
        .github/**/workflows/
        "

        # 从索引和磁盘彻底清除这些文件
        for path in $EXCLUDE_LIST; do
          git rm -rf --cached "$path" 2>/dev/null || true
          rm -rf "$path" 2>/dev/null || true
        done

        # 防止这些文件在 git add . 时再次被追踪
        git ls-files -z | grep -zE '^(README\.md|\.github/.*workflows)' | xargs -0 git update-index --assume-unchanged || true

    - name: 提交并推送更新（含变更列表）
      run: |
        cd upstream
        git add .
        if git diff --cached --quiet; then
          echo "📦 tvbox 同步报告%0A%0A🟢 无变更%0A🕒 时间: $(date -u '+%Y-%m-%d %H:%M UTC')" > report.txt
        else
          git diff --cached --name-only > changed_files.txt
          CHANGED=$(cat changed_files.txt | sed 's/^/ - /' | sed ':a;N;$!ba;s/\n/%0A/g')
          git commit -m "🔄 Sync from cluntop/tvbox $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
          echo "📦 tvbox 同步报告%0A%0A✅ 已同步更新%0A🕒 时间: $(date -u '+%Y-%m-%d %H:%M UTC')%0A📄 变更文件:%0A$CHANGED" > report.txt
        fi

    - name: Telegram 通知（成功）
      if: success()
      run: |
        curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
        -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
        -d text="$(cat upstream/report.txt)"

    - name: Telegram 通知（失败）
      if: failure()
      run: |
        curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
        -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
        -d text="📦 tvbox 同步失败！%0A❌ 请检查 Actions 日志%0A🕒 时间: $(date -u '+%Y-%m-%d %H:%M UTC')"
