name: Sync upstream repository

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC 0点自动同步
  workflow_dispatch:      # 允许手动触发

jobs:
  sync-repo:
    runs-on: ubuntu-latest
    timeout-minutes: 3    # 关键防护：3分钟超时强制终止
    outputs:
      sync-status: ${{ steps.result.outputs.status }}

    steps:
      - name: Start timer
        uses: gerred/actions/use-current-time@master
        id: timer-start
      
      # 1. 同步上游仓库
      - name: Sync repository
        uses: repo-sync/github-sync@v2
        with:
          source_repo: "cluntop/tvbox"
          destination_repo: "13ztop/tvbox"
          github_token: ${{ secrets.SYNC_TOKEN }}
          force: true
          exclude: |
            README.md
            .github/workflows/*

      # 2. 记录执行结果
      - name: Set result status
        id: result
        run: |
          if [ $? -eq 0 ]; then
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "status=failure" >> $GITHUB_OUTPUT
          fi
      
      # 3. 结束计时
      - name: Stop timer
        uses: gerred/actions/use-current-time@master
        id: timer-stop

  # 4. Telegram通知（独立作业）
  notify:
    needs: sync-repo
    runs-on: ubuntu-latest
    outputs:
      duration: ${{ steps.calc-duration.outputs.value }}
    
    steps:
      - name: Calculate duration
        id: calc-duration
        run: |
          START=${{ needs.sync-repo.outputs.timer-start }}
          END=${{ needs.sync-repo.outputs.timer-stop }}
          DURATION=$(( END - START ))
          echo "value=$DURATION" >> $GITHUB_OUTPUT
      
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1
        with:
          token: ${{ secrets.TG_TOKEN }}
          to: ${{ secrets.TG_CHAT_ID }}
          message: |
            ⚡️ *仓库同步报告*
            -------------------------------
            • 任务: \`Sync upstream repository\`
            • 仓库: [13ztop/tvbox](https://github.com/13ztop/tvbox)
            • 状态: `${{ needs.sync-repo.outputs.sync-status }}`
            • 耗时: ${{ needs.notify.outputs.duration }} 秒
            • 触发方式: \`${{ github.event_name }}\`
            -------------------------------
            ${{ needs.sync-repo.outputs.sync-status == 'success' && '✅ 同步成功！' || '❌ 同步失败！请检查日志：' }}
            ${{ needs.sync-repo.outputs.sync-status != 'success' && format('https://github.com/13ztop/tvbox/actions/runs/{0}', github.run_id) }}
