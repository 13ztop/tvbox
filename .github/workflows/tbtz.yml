name: Sync upstream repository

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点自动同步
  workflow_dispatch:      # 允许手动触发

jobs:
  sync-repo:
    runs-on: ubuntu-latest
    outputs:
      run-status: ${{ job.status }}
      timestamp: ${{ steps.get-timestamp.outputs.time }}

    steps:
      # 获取当前时间戳 (优化放在第一步)
      - name: Get current timestamp
        id: get-timestamp
        run: echo "time=$(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      # 检出目标仓库
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          repository: 13ztop/tvbox
          token: ${{ secrets.SYNC_TOKEN }}
          path: target

      # 克隆源仓库
      - name: Clone source repo
        run: git clone --depth 1 https://github.com/cluntop/tvbox.git source

      # 同步并排除文件
      - name: Sync with exclusions
        run: |
          # 删除需要排除的内容
          rm -rf source/README.md source/.github/workflows

          # 移动所有文件
          mv -f source/* target/ > /dev/null 2>&1 || :
          mv -f source/.* target/ > /dev/null 2>&1 || :

          # 配置 Git 身份
          cd target
          git config user.name "Sync Bot"
          git config user.email "actions@github.com"
          
          # 检测是否有变更
          if git diff --quiet --exit-code; then
            echo "没有检测到变更" > $GITHUB_STEP_SUMMARY
            exit 0
          fi
          
          # 提交变更
          git add --all
          git commit -m "chore: auto-sync (${{ steps.get-timestamp.outputs.time }})"

      # 推送更改
      - name: Push changes
        run: |
          cd target
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.SYNC_TOKEN }}

      # 记录同步状态
      - name: Record sync status
        id: set-status
        run: |
          if [ $? -eq 0 ]; then
            echo "run-status=success" >> $GITHUB_OUTPUT
          else
            echo "run-status=failure" >> $GITHUB_OUTPUT
          fi

  notify:
    needs: sync-repo
    runs-on: ubuntu-latest
    
    steps:
      # 发送 Telegram 通知
      - name: Send Telegram notification
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TG_CHAT_ID }}
          token: ${{ secrets.TG_TOKEN }}
          message: |
            🚦 同步结果: ${{ needs.sync-repo.outputs.run-status }}
            📦 仓库: 13ztop/tvbox
            🕒 时间: ${{ needs.sync-repo.outputs.timestamp }}
            
            ${{ contains(needs.sync-repo.outputs.run-status, 'success') && '✅ 同步成功!' || '❌ 同步失败!' }}
            
            详细信息: https://github.com/13ztop/tvbox/actions
