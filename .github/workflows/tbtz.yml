name: Repository Sync and Update

on:
  workflow_dispatch:  # 允许手动触发
  schedule:
    - cron: '0 0 * * *'  # 每天UTC午夜自动运行

permissions:
  contents: write  # 必需写入权限

env:
  SOURCE_REPO: "cluntop/tvbox"
  TARGET_REPO: "your-username/target-repo"  # 替换为您的目标仓库
  SOURCE_REF: "2a85561"  # 源仓库指定提交
  COMMIT_MSG: "Sync: cluntop/tvbox@2a85561"
  SYNC_USER: "sync-bot"  # 同步操作使用的用户名

jobs:
  sync-and-update:
    runs-on: ubuntu-latest
    steps:
      # 步骤1: 检出源仓库
      - name: Checkout source repository (${{ env.SOURCE_REPO }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.SYNC_TOKEN }}  # 使用 SYNC_TOKEN
          path: source-repo
          fetch-depth: 0  # 获取完整历史记录

      # 步骤2: 检出目标仓库
      - name: Checkout target repository (${{ env.TARGET_REPO }})
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.SYNC_TOKEN }}  # 使用 SYNC_TOKEN
          path: target-repo
          fetch-depth: 0

      # 步骤3: 文件同步操作
      - name: Synchronize files
        run: |
          echo "📂 同步文件操作开始..."
          
          # 删除旧的工作流文件
          rm -fv target-repo/.github/workflows/static.yml
          rm -fv target-repo/.github/workflows/sync.yml
          rm -fv target-repo/.github/workflows/tv_run.yml
          rm -fv target-repo/.github/workflows/zip.yml
          
          # 创建新的工作流文件
          mkdir -p target-repo/.github/workflows
          touch target-repo/.github/workflows/tbtz.yml
          echo "✅ 创建 tbtz.yml"
          
          # 使用rsync高效同步文件
          echo "🔄 同步源仓库内容..."
          rsync -av --delete source-repo/ target-repo/ \
            --exclude='.git/' \
            --exclude='.github/workflows/static.yml' \
            --exclude='.github/workflows/sync.yml' \
            --exclude='.github/workflows/tv_run.yml' \
            --exclude='.github/workflows/zip.yml'
          
          echo "✅ 文件同步完成"

      # 步骤4: 配置Git环境
      - name: Configure Git
        working-directory: target-repo
        run: |
          git config user.name "${{ env.SYNC_USER }}"
          git config user.email "actions@users.noreply.github.com"
          git config pull.rebase true
          git remote set-url origin https://${{ env.SYNC_USER }}:${{ secrets.SYNC_TOKEN }}@github.com/${{ env.TARGET_REPO }}.git
          echo "🔧 Git配置完成"

      # 步骤5: 提交变更
      - name: Commit changes
        id: commit-changes
        working-directory: target-repo
        run: |
          # 添加所有变更
          git add -A
          
          # 检查是否有变更
          if [ -z "$(git status --porcelain)" ]; then
            echo "status=no changes" >> $GITHUB_OUTPUT
            echo "🟢 无变更需要提交"
          else
            git commit -m "${{ env.COMMIT_MSG }}"
            echo "status=changes committed" >> $GITHUB_OUTPUT
            echo "🔵 变更已提交: ${{ env.COMMIT_MSG }}"
            echo "📝 变更详情:"
            git show --stat
          fi

      # 步骤6: 推送变更
      - name: Push changes
        if: steps.commit-changes.outputs.status == 'changes committed'
        working-directory: target-repo
        run: |
          # 先拉取最新变更避免冲突
          echo "⬇️ 拉取最新变更..."
          git pull origin main
          
          # 带重试机制的推送
          echo "⬆️ 推送变更到仓库..."
          n=0
          max_retries=3
          delay=5
          
          while [ $n -lt $max_retries ]; do
            git push origin main && {
              echo "✅ 推送成功"
              exit 0
            }
            n=$((n+1))
            echo "🔄 推送尝试 $n 失败，${delay}秒后重试..."
            sleep $delay
          done
          
          echo "❌ 推送失败: $max_retries 次尝试后仍失败"
          exit 1

      # 步骤7: 状态报告
      - name: Report status
        if: always()
        run: |
          if ${{ success() }}; then
            if [ "${{ steps.commit-changes.outputs.status }}" = "no changes" ]; then
              echo "✅ 同步完成: 无变更"
            else
              echo "✅ 同步完成: 变更已成功推送"
            fi
          else
            echo "❌ 同步失败: 请检查之前的步骤"
            echo "诊断建议:"
            echo "1. 确认 SYNC_TOKEN 有 'repo' 权限"
            echo "2. 检查目标仓库是否存在"
            echo "3. 验证文件路径是否正确"
          fi
