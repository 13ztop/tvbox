name: Sync TVBox Repo

on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时运行一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout target repository
      uses: actions/checkout@v4
      with:
        repository: 13ztop/tvbox
        token: ${{ secrets.PAT_TOKEN }}

    - name: Set up Git
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    - name: Clone source repository
      run: |
        git clone https://github.com/cluntop/tvbox.git source_repo

    - name: Sync files
      run: |
        shopt -s extglob
        cp -r source_repo/!(README.md|.github) ./
        rm -rf source_repo

    - name: Commit and push changes
      run: |
        git add .
        git diff-index --quiet HEAD || git commit -m "Sync from cluntop/tvbox"
        git push

    - name: Send Telegram Notification (Success)
      if: success()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |-
          ✅ GitHub Actions 同步成功！
          仓库：13ztop/tvbox
          时间：${{ github.event.repository.pushed_at }}
          详情：https://github.com/13ztop/tvbox/actions/runs/${{ github.run_id }}

    - name: Send Telegram Notification (Failure)
      if: failure()
      uses: appleboy/telegram-action@master
      with:
        to: ${{ secrets.TELEGRAM_CHAT_ID }}
        token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        message: |-
          ❌ GitHub Actions 同步失败！
          仓库：13ztop/tvbox
          时间：${{ github.event.repository.pushed_at }}
          详情：https://github.com/13ztop/tvbox/actions/runs/${{ github.run_id }}
