name: TVBox Auto Sync

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC时间0点（北京时间8点）自动执行
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_REPO: "cluntop/tvbox"
      TARGET_REPO: "13ztop/tvbox"
    
    steps:
      # 设置时区（北京时间）
      - name: Set timezone
        run: |
          echo "CURRENT_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M %Z')" >> $GITHUB_ENV
          echo "TIME_SHORT=$(TZ='Asia/Shanghai' date +'%H:%M %Z')" >> $GITHUB_ENV

      # 获取仓库信息
      - name: Setup environment
        id: setup
        run: |
          # 获取源仓库信息
          source_info=$(curl -s "https://api.github.com/repos/${{ env.SOURCE_REPO }}")
          source_branch=$(echo "$source_info" | jq -r .default_branch)
          source_commit=$(curl -s "https://api.github.com/repos/${{ env.SOURCE_REPO }}/commits/$source_branch" | jq -r .sha)
          
          # 获取目标仓库默认分支
          target_branch=$(curl -s -H "Authorization: token ${{ secrets.SYNC_TOKEN }}" \
            "https://api.github.com/repos/${{ env.TARGET_REPO }}" | jq -r .default_branch)
          
          echo "source_branch=$source_branch" >> $GITHUB_ENV
          echo "source_commit=$source_commit" >> $GITHUB_ENV
          echo "source_short=${source_commit:0:7}" >> $GITHUB_ENV
          echo "target_branch=$target_branch" >> $GITHUB_ENV

      # 克隆仓库
      - name: Clone repositories
        run: |
          # 克隆源仓库
          git clone --depth 1 --branch "${{ env.source_branch }}" \
            "https://github.com/${{ env.SOURCE_REPO }}.git" source-repo
            
          # 克隆目标仓库
          git clone --depth 1 --branch "${{ env.target_branch }}" \
            "https://${{ secrets.SYNC_TOKEN }}@github.com/${{ env.TARGET_REPO }}.git" target-repo

      # 执行同步
      - name: Sync repositories
        run: |
          # 进入目标仓库目录
          cd target-repo
          
          # 使用rsync进行同步（排除指定内容）
          rsync -av --delete \
            --exclude='.git' \
            --exclude='.github/workflows/' \
            --exclude='README.md' \
            ../source-repo/ .
          
          # 文件权限处理
          find . -type d -exec chmod 755 {} \;
          find . -type f -exec chmod 644 {} \;

      # 检测变更
      - name: Check for changes
        id: changes
        run: |
          cd target-repo
          git config user.name "TVBox Sync Bot"
          git config user.email "tvbox-sync@users.noreply.github.com"
          
          git add -A
          if git diff-index --quiet HEAD --; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            changes_count=$(git diff --cached --numstat | wc -l)
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "changes_count=$changes_count" >> $GITHUB_OUTPUT
          fi

      # 提交变更
      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          cd target-repo
          git commit -m "📺 Auto Sync: ${{ env.SOURCE_REPO }}@${{ env.source_short }}"
          git push origin "${{ env.target_branch }}"
          echo "commit_sha=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 成功通知
      - name: Success notification
        if: success() && steps.changes.outputs.has_changes == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ *TVBox 同步成功 | ${{ env.TIME_SHORT }}*
            ━━━━━━━━━━━━━━━━━━━━━━━━
            🔄 **源仓库**: [${{ env.SOURCE_REPO }}@${{ env.source_short }}](https://github.com/${{ env.SOURCE_REPO }}/commit/${{ env.source_commit }})
            📦 **目标仓库**: [${{ env.TARGET_REPO }}@${{ env.commit_sha }}](https://github.com/${{ env.TARGET_REPO }}/commit/${{ env.commit_sha }})
            ━━━━━━━━━━━━━━━━━━━━━━━━
            📂 **变更文件**: ${{ steps.changes.outputs.changes_count }} 个
            🕒 **执行时间**: ${{ env.TIME_SHORT }}
            ━━━━━━━━━━━━━━━━━━━━━━━━
            [查看仓库](https://github.com/${{ env.TARGET_REPO }})

      # 无变更通知
      - name: No changes notification
        if: success() && steps.changes.outputs.has_changes == 'false'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ℹ️ *TVBox 无内容变更 | ${{ env.TIME_SHORT }}*
            ━━━━━━━━━━━━━━━━━━━━━━━━
            🔄 **源仓库**: [${{ env.SOURCE_REPO }}](https://github.com/${{ env.SOURCE_REPO })
            📦 **目标仓库**: [${{ env.TARGET_REPO }}](https://github.com/${{ env.TARGET_REPO }})
            ━━━━━━━━━━━━━━━━━━━━━━━━
            🆗 **同步状态**: 内容一致，无需更新
            🕒 **执行时间**: ${{ env.TIME_SHORT }}

      # 失败通知
      - name: Failure notification
        if: failure()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ‼️ *TVBox 同步失败 | ${{ env.TIME_SHORT }}*
            ━━━━━━━━━━━━━━━━━━━━━━━━
            ⚙️ **工作流**: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            🕒 **发生时间**: ${{ env.CURRENT_TIME }}
            ━━━━━━━━━━━━━━━━━━━━━━━━
            ❌ 错误详情: 请检查工作流日志
            [立即查看](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      # 清理工作区
      - name: Cleanup
        if: always()
        run: |
          rm -rf source-repo target-repo
