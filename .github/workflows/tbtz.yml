name: 🔄 Auto Sync from cluntop/tvbox

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC时间0点（北京时间8点）自动同步
  workflow_dispatch:      # 允许手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 增加超时时间
    steps:
      # 设置时区（上海时间）
      - name: Set Shanghai time
        id: set_time
        run: |
          CURRENT_TIME=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M %Z')
          CURRENT_TIME_SHORT=$(TZ='Asia/Shanghai' date +'%H:%M %Z')
          echo "CURRENT_TIME=$CURRENT_TIME" >> $GITHUB_ENV
          echo "CURRENT_TIME_SHORT=$CURRENT_TIME_SHORT" >> $GITHUB_ENV
          
      # 全局错误处理设置
      - name: Setup error handling
        run: |
          touch /tmp/sync_error.log
          trap 'echo "错误发生在第 $LINENO 行" >> /tmp/sync_error.log; exit 1' ERR

      # 获取目标仓库的默认分支
      - name: Detect target default branch
        id: branch_detector
        run: |
          DEFAULT_BRANCH=$(curl -s -H "Authorization: token ${{ secrets.SYNC_TOKEN }}" \
          "https://api.github.com/repos/13ztop/tvbox" | jq -r .default_branch)
          echo "Detected default branch: $DEFAULT_BRANCH"
          echo "DEFAULT_BRANCH=$DEFAULT_BRANCH" >> $GITHUB_ENV

      # 检出目标仓库
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          repository: 13ztop/tvbox
          path: target-repo
          ref: ${{ env.DEFAULT_BRANCH }}
          fetch-depth: 0

      # 克隆源仓库
      - name: Clone source repo
        run: |
          git clone --depth 1 https://github.com/cluntop/tvbox.git source-repo
          echo "源仓库 cluntop/tvbox 克隆完成"

      # 同步前检查
      - name: Check source updates
        id: check_updates
        run: |
          cd source-repo
          SOURCE_COMMIT=$(git rev-parse HEAD)
          cd ../target-repo
          TARGET_COMMIT=$(git rev-parse HEAD)
          
          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> $GITHUB_ENV
          echo "TARGET_COMMIT=$TARGET_COMMIT" >> $GITHUB_ENV
          
          if [ "$SOURCE_COMMIT" = "$TARGET_COMMIT" ]; then
            echo "no_changes=true" >> $GITHUB_OUTPUT
            echo "::notice::提前中止：源仓库与目标仓库已同步"
            exit 0
          fi

      # 创建备份目录
      - name: Create backup directory
        run: mkdir -p /tmp/repo-backup

      # 识别需要保留的文件
      - name: Identify protected files
        id: find_protected
        run: |
          protected_files=(
            "README*" "LICENSE*" ".github/**" "config*.json" "*.pac"
            "rules/**" "scripts/**" "resource/**" "custom/**" "backup/**"
            ".gitignore" "*.key" "*.cert" "secrets/**" "*.env" "credentials*"
          )
          
          mkdir -p /tmp/repo-backup
          for pattern in "${protected_files[@]}"; do
            find target-repo -path "*/$pattern" -print >> /tmp/repo-backup/protected-files.txt 2>/dev/null || true
          done
          
          if [ -f "target-repo/.syncignore" ]; then
            while read pattern; do
              [ -z "$pattern" ] || [ "${pattern:0:1}" = "#" ] && continue
              find target-repo -path "*/$pattern" -print >> /tmp/repo-backup/protected-files.txt 2>/dev/null || true
            done < target-repo/.syncignore
          fi
          
          if [ -f /tmp/repo-backup/protected-files.txt ]; then
            protected_count=$(sort -u /tmp/repo-backup/protected-files.txt | wc -l)
            echo "protected_files_count=$protected_count" >> $GITHUB_OUTPUT
          else
            echo "protected_files_count=0" >> $GITHUB_OUTPUT
          fi
          
          echo "保护文件识别完成"

      # 备份需要保留的文件
      - name: Backup protected content
        run: |
          mkdir -p /tmp/repo-backup/protected-files
          
          if [ -f /tmp/repo-backup/protected-files.txt ]; then
            while read file; do
              if [ -f "$file" ] || [ -d "$file" ]; then
                relative_path=${file#target-repo/}
                mkdir -p "/tmp/repo-backup/protected-files/$(dirname "$relative_path")"
                cp -r "$file" "/tmp/repo-backup/protected-files/$relative_path"
              fi
            done < <(sort -u /tmp/repo-backup/protected-files.txt)
          fi
          
          echo "保护文件备份完成"

      # 获取源仓库版本信息
      - name: Get source repository version
        id: source_version
        run: |
          cd source-repo
          echo "commit_hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "full_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "commit_date=$(git log -1 --format=%cd --date=format:'%Y-%m-%d')" >> $GITHUB_OUTPUT

      # 检查大文件（预警）
      - name: Check large files in source
        run: |
          echo "检查源仓库中的大文件:"
          find source-repo -size +10M -exec echo "::warning file={},line=1::发现大文件 (>10MB): {}" \;
          
          echo "大文件列表（>5MB）:"
          find source-repo -size +5M -exec ls -lh {} \; | head -n 20 || true

      # 修复：rsync错误处理
      - name: Sync repositories
        run: |
          set +e  # 禁用立即退出
          
          echo "开始同步操作..."
          rsync -av --delete \
            --exclude=.git \
            --exclude-from=/tmp/repo-backup/protected-files.txt \
            source-repo/ target-repo/ | tee /tmp/rsync.log
          
          RSYNC_EXIT=$?
          
          # 记录变更统计
          changes_count=$(grep -E '^(>f|cd)' /tmp/rsync.log | wc -l)
          echo "changes_count=$changes_count" >> $GITHUB_ENV
          
          # 处理错误代码
          if [ $RSYNC_EXIT -ne 0 ]; then
            echo "::warning::rsync 完成但有警告 (退出代码 $RSYNC_EXIT)"
            echo "同步日志摘要:"
            grep -E '(warning|error)' /tmp/rsync.log || true
          fi
          
          echo "源仓库内容同步完成"
          exit 0  # 确保步骤标记为成功

      # 恢复保护文件
      - name: Restore protected content
        run: |
          if [ -d /tmp/repo-backup/protected-files ]; then
            cd /tmp/repo-backup/protected-files
            find . -type f -o -type d | while read item; do
              if [ -f "$item" ] || [ -d "$item" ]; then
                relative_path=${item#./}
                mkdir -p "$GITHUB_WORKSPACE/target-repo/$(dirname "$relative_path")"
                cp -r "$item" "$GITHUB_WORKSPACE/target-repo/$relative_path"
              fi
            done
          fi
          
          echo "保护文件恢复完成"

      # 同步后验证
      - name: Verify sync integrity
        run: |
          required_files=("config.json" "README.md")
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "target-repo/$file" ]; then
              missing_files+=("$file")
            fi
          done
          
          if [ ${#missing_files[@]} -ne 0 ]; then
            echo "❌ 关键文件缺失: ${missing_files[*]}" >&2
            exit 1
          fi
          
          echo "同步完整性验证通过"

      # 提交和推送变更
      - name: Commit and push changes
        id: commit_push
        run: |
          cd target-repo
          git config user.name "TVBox Sync Bot"
          git config user.email "tvbox-sync@users.noreply.github.com"
          git add -A
          
          # 生成变更统计
          added_files=$(git diff --cached --name-status | grep -c '^A' || true)
          modified_files=$(git diff --cached --name-status | grep -c '^M' || true)
          deleted_files=$(git diff --cached --name-status | grep -c '^D' || true)
          
          # 生成提交信息
          commit_msg="🔄 智能同步: 来自 cluntop/tvbox@${{ steps.source_version.outputs.commit_hash }}"
          commit_msg+="\n\n## 变更统计"
          commit_msg+="\n- 新增文件: $added_files"
          commit_msg+="\n- 修改文件: $modified_files"
          commit_msg+="\n- 删除文件: $deleted_files"
          
          if [ ${{ steps.find_protected.outputs.protected_files_count }} -gt 0 ]; then
            commit_msg+="\n\n## 保留配置"
            commit_msg+="\n- 自定义文件: ${{ steps.find_protected.outputs.protected_files_count }}"
          fi
          
          git commit -m "$(echo -e $commit_msg)"
          
          # 使用强制推送确保能更新受保护分支
          git push --force-with-lease origin HEAD:${{ env.DEFAULT_BRANCH }}
          
          echo "TARGET_COMMIT_AFTER=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "TARGET_FULL_HASH_AFTER=$(git rev-parse HEAD)" >> $GITHUB_ENV
          
          echo "commit_msg=$commit_msg" >> $GITHUB_OUTPUT
          echo "变更已成功推送"

      # 修复：简化报告生成逻辑
      - name: Generate sync report
        if: always()
        run: |
          # 使用安全的方式生成报告
          echo "### 🔄 TVBox 同步报告" >> $GITHUB_STEP_SUMMARY
          echo "**执行时间**: ${{ env.CURRENT_TIME }}" >> $GITHUB_STEP_SUMMARY
          
          # 安全地获取源仓库信息
          if [ -n "${{ steps.source_version.outputs.commit_hash }}" ]; then
            echo "**源仓库**: [cluntop/tvbox@${{ steps.source_version.outputs.commit_hash }}](https://github.com/cluntop/tvbox/commit/${{ steps.source_version.outputs.full_hash }})" >> $GITHUB_STEP_SUMMARY
          fi
          
          # 安全地获取目标仓库信息
          if [ -n "${{ env.TARGET_COMMIT_AFTER || env.TARGET_COMMIT }}" ]; then
            echo "**目标仓库**: [13ztop/tvbox@${{ env.TARGET_COMMIT_AFTER || env.TARGET_COMMIT }}](https://github.com/13ztop/tvbox/commit/${{ env.TARGET_FULL_HASH_AFTER || env.TARGET_COMMIT }})" >> $GITHUB_STEP_SUMMARY
          fi
          
          # 同步状态判断
          if [[ "${{ steps.check_updates.outputs.no_changes }}" == 'true' ]]; then
            echo "#### 🔍 同步状态: 无需更新" >> $GITHUB_STEP_SUMMARY
            echo "源仓库与目标仓库内容已同步，无变更需要提交" >> $GITHUB_STEP_SUMMARY
            echo "![状态](https://img.shields.io/badge/状态-最新-brightgreen)" >> $GITHUB_STEP_SUMMARY
          elif ${{ success() }}; then
            echo "#### ✅ 同步状态: 成功" >> $GITHUB_STEP_SUMMARY
            echo "**文件变更统计**:" >> $GITHUB_STEP_SUMMARY
            echo "- 新增文件: $added_files" >> $GITHUB_STEP_SUMMARY
            echo "- 修改文件: $modified_files" >> $GITHUB_STEP_SUMMARY
            echo "- 删除文件: $deleted_files" >> $GITHUB_STEP_SUMMARY
            echo "- 保留文件: ${{ steps.find_protected.outputs.pr
