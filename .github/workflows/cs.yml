name: Auto Sync from cluntop/tvbox

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点执行（北京时间 8 点）
  workflow_dispatch: # 允许手动执行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:

    - name: 设置 Git 用户
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

    - name: 克隆上游仓库
      run: |
        git clone --depth=1 https://github.com/cluntop/tvbox upstream

    - name: 克隆目标仓库
      run: |
        git clone --depth=1 https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/13ztop/tvbox target
        cp -r target/.git upstream/

    - name: 删除排除文件
      run: |
        cd upstream
        rm -f README.md || true
        rm -rf .github/workflows || true

    - name: 推送到目标仓库
      run: |
        cd upstream
        git add .
        if git diff --cached --quiet; then
          echo "📦 tvbox 同步报告%0A%0A🟢 无变更%0A🕒 时间: $(date -u '+%Y-%m-%d %H:%M UTC')" > report.txt
        else
          git diff --cached --name-only > changed_files.txt
          CHANGED=$(cat changed_files.txt | sed 's/^/ - /' | sed ':a;N;$!ba;s/\n/%0A/g')
          git commit -m "🔄 Sync from cluntop/tvbox $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
          echo "📦 tvbox 同步报告%0A%0A✅ 已同步更新%0A🕒 时间: $(date -u '+%Y-%m-%d %H:%M UTC')%0A📄 变更文件:%0A$CHANGED" > report.txt
        fi

    - name: Telegram 通知（成功）
      if: success()
      run: |
        curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
        -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
        -d text="$(cat upstream/report.txt)"

    - name: Telegram 通知（失败）
      if: failure()
      run: |
        curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
        -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
        -d text="📦 tvbox 同步失败！%0A❌ 请检查 Actions 日志%0A🕒 时间: $(date -u '+%Y-%m-%d %H:%M UTC')"
