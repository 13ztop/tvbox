name: Auto Sync from cluntop/tvbox

on:
  schedule:
    - cron: '0 */6 * * *'  # 每 6 小时执行一次
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PROTECTED_PATHS: |
        README.md
        LICENSE
        .github/workflows/
        config.json
        custom_config.json
        proxy.pac
        rules/
        scripts/
        resource/
        .gitignore

    steps:
      - name: Set source commit info
        id: source_info
        run: |
          git clone --depth 1 https://github.com/cluntop/tvbox.git source-repo
          cd source-repo
          echo "hash=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "full_hash=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(git log -1 --format=%cd --date=format:'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Set dynamic PR branch
        run: echo "PR_BRANCH=sync/cluntop-${{ steps.source_info.outputs.hash }}" >> $GITHUB_ENV

      - name: Get default branch of target repo
        run: |
          branch=$(curl -s -H "Authorization: token ${{ secrets.SYNC_TOKEN }}" https://api.github.com/repos/13ztop/tvbox | jq -r .default_branch)
          echo "DEFAULT_BRANCH=$branch" >> $GITHUB_ENV

      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          repository: 13ztop/tvbox
          ref: ${{ env.DEFAULT_BRANCH }}
          path: target-repo
          fetch-depth: 0

      - name: Backup protected files
        run: |
          mkdir -p /tmp/protected
          while read path; do
            full_path="target-repo/$path"
            if [ -e "$full_path" ]; then
              mkdir -p "/tmp/protected/$(dirname "$path")"
              cp -r "$full_path" "/tmp/protected/$path"
            fi
          done <<< "${{ env.PROTECTED_PATHS }}"

      - name: Sync source to target
        run: rsync -av --delete --exclude='.git' source-repo/ target-repo/

      - name: Restore protected files
        run: rsync -av /tmp/protected/ target-repo/

      - name: Detect changes and prepare PR
        id: detect_changes
        run: |
          cd target-repo
          git config user.name "TVBox Sync Bot"
          git config user.email "tvbox-sync@users.noreply.github.com"
          git checkout -b ${{ env.PR_BRANCH }}
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            git diff --cached --name-only | head -n 10 > ../changed_files.txt
            full_count=$(git diff --cached --name-only | wc -l)
            echo "changes=$full_count" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.detect_changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.SYNC_TOKEN }}
          path: target-repo
          commit-message: "🔁 同步: cluntop/tvbox 自动同步更新"
          branch: ${{ env.PR_BRANCH }}
          title: "🔁 同步更新 cluntop/tvbox@${{ steps.source_info.outputs.hash }}"
          body: |
            自动同步自 cluntop/tvbox 源仓库。

            - 来源提交：`${{ steps.source_info.outputs.full_hash }}`
            - 文件更新：${{ steps.detect_changes.outputs.changes }} 个

            请在合并前检查保留文件是否正确。
          base: ${{ env.DEFAULT_BRANCH }}
        id: cpr

      - name: Set Time
        id: time
        run: |
          echo "now=$(TZ='Asia/Shanghai' date +'%Y-%m-%d %H:%M %Z')" >> $GITHUB_OUTPUT
          echo "now_short=$(TZ='Asia/Shanghai' date +'%H:%M %Z')" >> $GITHUB_OUTPUT

      - name: Notify Telegram - PR Created
        if: steps.detect_changes.outputs.changed == 'true'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🚀 *TVBox PR 同步通知*
            🕒 ${{ steps.time.outputs.now_short }}

            🔄 源仓库: [cluntop/tvbox](https://github.com/cluntop/tvbox)
            📦 目标仓库: [13ztop/tvbox](https://github.com/13ztop/tvbox)

            🧾 更新文件数: ${{ steps.detect_changes.outputs.changes }} 个
            🗂️ 变更文件（前10）:
            ```
            $(cat changed_files.txt)
            ```
            🔁 PR 链接: [点击查看](${{ steps.cpr.outputs.pull-request-url }})
          parse_mode: markdown

      - name: Notify Telegram - No Changes
        if: steps.detect_changes.outputs.changed == 'false'
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ℹ️ *TVBox 同步检查*
            🕒 ${{ steps.time.outputs.now_short }}

            🔄 源仓库: [cluntop/tvbox](https://github.com/cluntop/tvbox)
            📦 目标仓库: [13ztop/tvbox](https://github.com/13ztop/tvbox)

            ✅ 无需更新，内容一致。
          parse_mode: markdown
